<style>
  :root { --bg:#09090c; --card:#121218; --fg:#f4f4f6; --muted:#9a9aa6; --line:#23232c; --accent:#8b5cf6; --gut:32px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { color-scheme:dark; scrollbar-color:#34343f var(--bg); scrollbar-gutter:stable; scroll-behavior:smooth; }
  ::-webkit-scrollbar { width:10px; } ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:#34343f; border-radius:5px; }
  body { background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
           height:64px; padding:0 var(--gut); background:rgba(9,9,12,.8); backdrop-filter:blur(12px);
           border-bottom:1px solid var(--line); user-select:none; }
  header img { height:22px; display:block; }
  nav { display:flex; gap:24px; font-size:14px; font-weight:500; color:var(--muted); }
  nav a:hover { color:var(--fg); }
  .hero { position:relative; padding:120px var(--gut) 96px; overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:-200px -200px auto auto; width:760px; height:760px;
                  background:radial-gradient(closest-side, rgba(139,92,246,.28), transparent); pointer-events:none; }
  .hero img { width:min(520px, 80vw); display:block; position:relative; }
  .hero h1 { font-size:clamp(20px, 3vw, 28px); font-weight:500; color:var(--muted); margin-top:28px; position:relative; }
  .ctas { display:flex; flex-wrap:wrap; gap:12px; margin-top:36px; position:relative; }
  .btn { display:inline-flex; align-items:center; gap:10px; height:48px; padding:0 24px; border-radius:999px;
         font-weight:600; font-size:15px; border:1px solid var(--line); transition:transform .15s, border-color .15s; user-select:none; }
  .btn:hover { transform:translateY(-2px); border-color:#3a3a46; }
  .btn.solid { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .btn svg { width:18px; height:18px; flex-shrink:0; }
  section { padding:72px var(--gut); border-top:1px solid var(--line); }
  h2 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:28px; user-select:none; }
  h2 .n { color:var(--muted); font-weight:500; }
  .app { display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
  .app img { width:96px; height:96px; border-radius:22px; box-shadow:0 12px 40px rgba(139,92,246,.35); }
  .app .t { flex:1 1 240px; min-width:0; }
  .app h3 { font-size:24px; font-weight:700; }
  .app p { color:var(--muted); margin-top:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .card { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
          transition:transform .15s, border-color .15s; }
  .card:hover { transform:translateY(-3px); border-color:#3a3a46; }
  .card img { display:block; width:100%; height:auto; aspect-ratio:720/393; object-fit:cover; background:#1a1a22; }
  .card .row { display:flex; align-items:center; gap:12px; height:48px; padding:0 16px; }
  .card .name { flex:1; min-width:0; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .price { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .links { display:flex; flex-wrap:wrap; gap:12px; }
  footer { display:flex; flex-wrap:wrap; gap:24px; padding:32px var(--gut); border-top:1px solid var(--line);
           color:var(--muted); font-size:13px; user-select:none; }
  footer a:hover { color:var(--fg); }
  @media (max-width:640px) {
    :root { --gut:16px; }
    nav { gap:16px; } nav .wide { display:none; }
    .hero { padding:72px var(--gut) 64px; }
    section { padding:56px var(--gut); }
  }
</style>
