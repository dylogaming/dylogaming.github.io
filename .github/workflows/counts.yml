name: Refresh community counts
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python counts.py
      - run: python build.py
      - run: |
          git config user.name "DYLO Gaming"
          git config user.email "dylogamingofficial@gmail.com"
          git diff --quiet index.html || { git add counts.json index.html && git commit -m "Refresh community counts" && git push; }
